name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall cowarch scripts
      - name: Compile notebook code cells
        run: python scripts/00_check_notebooks.py --compile-only
